name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Yerel bileşenleri derle (ByeDPI, hev-socks5-tunnel, Xray)
        run: bash scripts/build-natives.sh

      - name: APK derle
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK adını düzenle
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/DarknesVPN-${{ github.run_number }}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: DarknesVPN-${{ github.run_number }}
          path: dist/*.apk

      - name: Sürüm yayınla (telefondan kolay indirmek için)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Darknes VPN ${{ github.run_number }}
          make_latest: true
          files: dist/*.apk
          body: |
            Telefondan indir: aşağıdaki **DarknesVPN-${{ github.run_number }}.apk** dosyasına dokun.
